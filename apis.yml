apis:
- aid: spiffe:spiffe-workload-api
  name: SPIFFE Workload API
  description: >-
    The SPIFFE Workload API is a gRPC streaming interface through which workloads request and receive
    SPIFFE Verifiable Identity Documents (SVIDs) including X.509-SVIDs and JWT-SVIDs, as well as trust
    bundle updates. It enables software to obtain cryptographic identities at runtime without requiring
    secrets to be embedded in configuration or code.
  humanURL: https://github.com/spiffe/spiffe/blob/main/standards/SPIFFE_Workload_API.md
