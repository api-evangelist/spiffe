- aid: spiffe:spiffe-x509-svid-api
  name: SPIFFE X.509 SVID
  description: >-
    The SPIFFE X.509 SVID (SPIFFE Verifiable Identity Document) is a standard for encoding SPIFFE identities
    into X.509 certificates. The Subject Alternative Name field carries the SPIFFE ID URI, enabling mutual
    TLS authentication between workloads using standard X.509 certificate validation libraries.
  humanURL: https://github.com/spiffe/spiffe/blob/main/standards/X509-SVID.md
  properties:
  - type: Documentation
    url: https://spiffe.io/docs/latest/spiffe-about/svid/
  - type: Reference
    url: https://github.com/spiffe/spiffe/blob/main/standards/X509-SVID.md
  - type: GitHubRepository
    url: https://github.com/spiffe/spiffe
  tags:
  - Certificate
  - Identity
  - mTLS
  - Security
  - X.509
- aid: spiffe:spiffe-jwt-svid-api
  name: SPIFFE JWT SVID
  description: >-
    The SPIFFE JWT SVID standard defines a format for encoding SPIFFE identities as JSON Web Tokens. JWT-SVIDs
    are used in scenarios where X.509 certificates are not practical, such as HTTP header-based authentication
    between services or for passing identity across trust domain boundaries.
  humanURL: https://github.com/spiffe/spiffe/blob/main/standards/JWT-SVID.md
  properties:
  - type: Documentation
    url: https://spiffe.io/docs/latest/spiffe-about/svid/
